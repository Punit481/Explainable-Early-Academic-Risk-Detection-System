server {
    listen 80;
    root /usr/share/nginx/html;

    # CSV uploads (the api itself allows up to 1 MB)
    client_max_body_size 2m;

    # /api/classes -> http://api:3000/classes (the trailing slash removes "/api")
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built files have a content hash in their name, so browsers can keep them forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React handles the routes (/classes/2, /students/10, ...): always serve index.html
    location / {
        try_files $uri /index.html;
    }
}
