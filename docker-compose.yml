# Local development: PostgreSQL for the api.
# Start with `docker compose up -d`. ml-service, api and web are added in step 5.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: risk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
